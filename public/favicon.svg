<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="60%" stop-color="#121215" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Metallic Edge Stroke -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2ae3d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f2ae3d" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="slice1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ba50" />
      <stop offset="100%" stop-color="#f08a3c" />
    </linearGradient>

    <linearGradient id="slice2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06228" />
      <stop offset="100%" stop-color="#b83818" />
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c34" />
      <stop offset="100%" stop-color="#1b1b22" />
    </linearGradient>
  </defs>

  <!-- iOS / macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGlow)" stroke="url(#edgeGrad)" stroke-width="2" />

  <!-- Ambient focal glow behind the disk -->
  <circle cx="256" cy="256" r="170" fill="url(#amberGlow)" />

  <!-- ONE SINGLE CENTRAL OBJECT: The Minimalist Segmented Disk Platter -->
  <g transform="translate(256, 256)">
    <!-- Base track ring: Unallocated / Available disk space -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#trackGrad)" stroke-width="48" stroke-linecap="round" />

    <!-- Secondary Sector (Warm Crimson/Orange - System / Cached space) -->
    <!-- Arc from 130 deg to 230 deg -->
    <path d="M -90 107 A 140 140 0 0 1 -140 0" fill="none" stroke="url(#slice2)" stroke-width="48" stroke-linecap="round" />

    <!-- Primary Active Sector (Luminous Amber - Heavy Workloads / Scanned Memory) -->
    <!-- Sweeping prominent arc from -60 deg to 90 deg -->
    <path d="M 70 -121 A 140 140 0 0 1 0 140" fill="none" stroke="url(#slice1)" stroke-width="52" stroke-linecap="round" />

    <!-- Inner Core Hub (Deep Titanium Spindle) -->
    <circle cx="0" cy="0" r="62" fill="#15151a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" />
    
    <!-- Center Live Diagnostic Jewel -->
    <circle cx="0" cy="0" r="22" fill="#f2ae3d" />
    <circle cx="0" cy="0" r="14" fill="#fff5e0" />
  </g>
</svg>

